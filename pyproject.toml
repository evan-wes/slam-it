[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "slam-it"
# Canonical version lives in the VERSION file; scikit-build-core reads it at build time.
dynamic = ["version"]
description = "A learning ladder for visual SLAM, in Python, C++ and Rust."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
authors = [{ name = "evan-wes" }]
# Pillow reads image files, in slam_it.eval.images alone (a contract below keeps it there).
# GTSAM is rung 0's factor-graph back end (slam_it.foundations.graphs). scripts/setup_slam_it.sh
# builds it from its release and pip-installs its Python bindings, built over the same library
# the C++ core links; the env asks no index for it. The worker's image, whose Python imports it
# but never solves with it, installs PyPI's 4.3.0 wheel, pinned by its hash
# (scripts/locks/worker-gtsam.lock).
dependencies = ["numpy>=2.0", "pillow>=10.0", "gtsam>=4.3"]

[project.optional-dependencies]
# COLMAP's Ceres bundle adjuster, for slam_it.eval.colmap_reference (the only importer).
# The development setup installs it too (scripts/setup_slam_it.sh): it is the reference the
# BA tests and demos compare against.
colmap = ["pycolmap>=4.2"]
# Video decoding (FFmpeg, through PyAV), for importing phone videos in slam_it.eval.video
# alone. The worker's image and the development setup install it.
video = ["av>=18.1"]
# The development and layer-1 toolchain's pip layer: the single list scripts/setup_slam_it.sh
# installs from when not using the lockfile (the conda layer -- compilers, clang tools,
# doxygen, Node.js/jscpd -- is in that script).
dev = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
  "maturin>=1.7",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "import-linter>=2.0",
  # Test-only oracles: SciPy (rotations, least squares) and mpmath (high-precision values
  # for the parity fixtures). manifpy comes from conda-forge (setup_slam_it.sh).
  "scipy>=1.13",
  "mpmath>=1.3",
  # Test-only oracle for the 5-point solvers and the Sampson refinement (a contract forbids
  # the library from importing any test oracle).
  "poselib>=2.0.5",
  # Visualisation for the demos (never imported by the library).
  "rerun-sdk>=0.38",
  # The upload demo's QR code of its page's address (scripts/serve_demo.py; never imported by
  # the library).
  "segno>=1.6",
  # Test-only oracle for the front end's image operations, and the reference the demos
  # compare against (never imported by the library; a contract forbids cv2 in slam_it).
  "opencv-python-headless>=5.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/slam_it"]
# Editable installs rebuild the C++ extension on import when its sources change
# (needs `pip install --no-build-isolation -e .`).
editable.rebuild = true
# scripts/setup_slam_it.sh sets a per-env build dir (build/<env name>); this is the default
# for other builds (CI, plain pip installs).
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\d+\.\d+\.\d+\.\d+)'

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# Docstring Examples are run as tests so they cannot go stale.
addopts = "--doctest-modules --strict-markers"
# Resource markers. scripts/check.sh runs the default CPU subset (`-m "not gpu and not budget"`);
# the budget runs are opt-in (`python -m pytest -m budget`, since PR 9); GPU runs get their own
# opt-in script with the first PyTorch rung.
markers = [
  "gpu: needs a CUDA GPU (learned and dense rungs)",
  "budget: runs under a simulated compute budget (slam_it.eval.budgets)",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Where first-party code lives: the library, and the upload server (server/).
src = [".", "src", "server/src"]

[tool.ruff.lint]
# D: docstrings (numpy convention) on every module, class and function.
# ANN: type hints on every signature. The rest: correctness, idiom, naming, imports.
select = ["E", "W", "F", "I", "N", "D", "ANN", "B", "UP", "SIM", "RUF", "PL", "PT", "NPY"]
ignore = [
  "PLR2004",  # magic values in comparisons: too noisy for numerical code with tolerances
]
# Greek letters in docstrings are the maths notation (ρ for translation, σ for scale, ...),
# not look-alikes of Latin letters.
allowed-confusables = ["ρ", "σ", "α", "ν", "×"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# pytest fixtures and parametrised arguments are documented by the test's docstring.
"tests/**" = ["ANN001", "ANN201", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/slam_it", "server/src/slam_it_server", "tests", "scripts"]
# The compiled extensions are never imported by name: slam_it.backends locates them
# dynamically, and each algorithm types its backend through a Protocol (e.g.
# slam_it.foundations.so3.Implementation) that tests check the extensions against.

[[tool.mypy.overrides]]
# Test-only oracles that ship without type information.
module = ["mpmath", "manifpy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# GTSAM's Python bindings ship py.typed but no stubs for their extension module, so its names
# are typed as Any.
module = ["gtsam", "gtsam.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The upload server's S3 client, which ships without type information.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["slam_it", "slam_it_server"]
include_external_packages = true

# The ladder as dependency layers, top to bottom. Siblings joined by `|` are independent:
# neither may import the other. Every module inside a package is covered automatically, and
# the contract is exhaustive: a new top-level package fails until it is given a layer.
# scripts/check_layers.py reads this same list to check the C++ includes and Rust crates.
[[tool.importlinter.contracts]]
name = "The ladder's layers (and independent sibling branches)"
type = "layers"
containers = ["slam_it"]
exhaustive = true
layers = [
  "orchestration",
  "eval",
  "learned | vi",
  "dense | edge | classic",
  "foundations",
  "backends",
]

# The order of modules inside rung 0. Parenthesised layers are optional: they are the modules
# milestone 1 adds, so the contract covers each as it lands, and Rust's `linalg` (the SVD and
# eigendecomposition its modules share), which Python does not need; check_layers.py holds the
# Rust crate to the same order.
[[tool.importlinter.contracts]]
name = "Rung 0's internal order"
type = "layers"
exhaustive = true
containers = ["slam_it.foundations"]
layers = [
  "(ba) | (graphs) | (twoview)",
  "(epipolar) | (homography) | (pnp) | (sim3) | (stereo)",
  "(camera) | (fivepoint) | (matching) | (p3p) | (ransac) | (triangulation) | (vocabulary)",
  "(nls) | (orb)",
  "(correspondences) | (image)",
  "(alignment)",
  "(se3)",
  "so3",
  "arrays | (linalg)",
  "(rng) | (solve)",
  "errors",
]

# The order of modules inside the bundle-adjustment package.
[[tool.importlinter.contracts]]
name = "Bundle adjustment's internal order"
type = "layers"
exhaustive = true
containers = ["slam_it.foundations.ba"]
layers = [
  "solve",
  "bundle",
  "layout | schur",
  "gauge",
  "problem",
]

# The order of modules inside the edge rung: the settings, a frame and the map at the bottom;
# the observation test and the covisibility graph, independent of each other, on them; bundle
# adjustment and the keyframe database, independent of each other, on those (the database needs
# only the map and the graph); initialisation, tracking and mapping, independent of each other,
# on those; relocalisation on tracking; the pipeline on top. New modules are optional layers.
[[tool.importlinter.contracts]]
name = "The edge rung's internal order"
type = "layers"
exhaustive = true
containers = ["slam_it.edge"]
layers = [
  "(pipeline)",
  "(loops) | (relocalization)",
  "(initialization) | (tracking) | (mapping)",
  "(adjust) | (database)",
  "(residuals) | (covisibility)",
  "map",
  "frames",
  "options",
]

# The order of modules inside orchestration: the run program at the bottom, so the program the
# budget runs time never carries the bake for the viewer. New modules are optional layers.
[[tool.importlinter.contracts]]
name = "Orchestration's internal order"
type = "layers"
exhaustive = true
containers = ["slam_it.orchestration"]
layers = [
  "(worker)",
  "(bundles)",
  "vo",
]

# OpenCV serves the demos as an external reference only: slam_it never wraps it (a stated
# non-goal), and the edge rungs need a light dependency set.
[[tool.importlinter.contracts]]
name = "slam_it never imports OpenCV"
type = "forbidden"
source_modules = ["slam_it"]
forbidden_modules = ["cv2"]

# Libraries are welcome in the runtime (the ladder's "Runtime dependencies", decided with
# evan-wes on 2026-10-17), so none is kept out for a test's sake: scipy may enter once a rung
# needs it, and a test then checks that rung against something else. These are test oracles
# that implement the library's own solvers (PoseLib) or its mathematics at high precision
# (mpmath, manif): nothing in the library needs them, and a rung that does adds it to the
# dependencies first.
[[tool.importlinter.contracts]]
name = "slam_it never imports its test oracles"
type = "forbidden"
source_modules = ["slam_it"]
forbidden_modules = ["poselib", "mpmath", "manifpy"]

# The order of modules inside eval: the timestamp helpers, the image reader, the sensor.yaml
# helpers, the LiDAR depth and a vocabulary's folder at the bottom, the dataset readers and
# metrics on them, runs (and the COLMAP reference) on them, then what writes a dataset's
# TUM-format folder with its ground truth (the video import, ZJU-SenseTime's, ARKitScenes'), the
# compute budgets, which judge runs, and the loops' judge, which judges a run's loops, and on top
# ADVIO's import, a video's through the video import. New modules are optional layers, as in
# rung 0's contract.
[[tool.importlinter.contracts]]
name = "Eval's internal order"
type = "layers"
exhaustive = true
containers = ["slam_it.eval"]
layers = [
  "(advio)",
  "(budgets) | (video) | (zju) | (arkitscenes) | (loops)",
  "(runs) | (colmap_reference)",
  "(metrics) | (tum) | (euroc) | (readers) | (reprojection)",
  "(timestamps) | (images) | (lenses) | (lidar) | (sensor_yaml) | (vocabularies)",
]

# Pillow reads image files in slam_it.eval.images alone: the cores decode PNGs natively, and
# the algorithms take arrays, never files.
[[tool.importlinter.contracts]]
name = "Only eval.images may import Pillow"
type = "forbidden"
# An allow-list, as for pycolmap below: all of slam_it is forbidden, the one reader excepted.
source_modules = ["slam_it"]
forbidden_modules = ["PIL"]
ignore_imports = ["slam_it.eval.images -> PIL"]

# GTSAM stands behind rung 0's factor graphs alone (the ladder; B3's review panel, A10): no other
# module imports it, and graphs' own converters to its types are private. check_layers.py holds
# C++'s includes of <gtsam/...> to graphs.cpp and the Rust crate's bridge the same way.
[[tool.importlinter.contracts]]
name = "Only foundations.graphs may import gtsam"
type = "forbidden"
source_modules = ["slam_it"]
forbidden_modules = ["gtsam"]
ignore_imports = ["slam_it.foundations.graphs -> gtsam"]

# The algorithm rungs take arrays, never files: none imports what reads, finds or hashes one.
# Eval reads their files for them (a vocabulary's folder in slam_it.eval.vocabularies, the run
# format in slam_it.eval.runs), as its native libraries do for the C++ and Rust cores, which
# scripts/check_layers.py holds to the same (no <fstream>, <filesystem> or <cstdio>, no std::fs).
# import-linter cannot see the builtin open() or np.load. The source list is explicit: a new
# algorithm rung (calib) must be added to it.
[[tool.importlinter.contracts]]
name = "The algorithm rungs read no files"
type = "forbidden"
source_modules = [
  "slam_it.foundations",
  "slam_it.edge",
  "slam_it.vi",
  "slam_it.classic",
  "slam_it.dense",
  "slam_it.learned",
]
forbidden_modules = [
  "hashlib",
  "io",
  "json",
  "os",
  "pathlib",
  "pickle",
  "shutil",
  "tarfile",
  "tempfile",
  "zipfile",
]
# The rungs' own modules: slam_it.backends, below them, finds the compiled programs by path.
allow_indirect_imports = true

# PyAV decodes phone videos in slam_it.eval.video alone (the optional `video` extra): the
# pipeline reads frames from a folder, never a video.
[[tool.importlinter.contracts]]
name = "Only eval.video may import PyAV"
type = "forbidden"
source_modules = ["slam_it"]
forbidden_modules = ["av"]
ignore_imports = ["slam_it.eval.video -> av"]

# pycolmap is an optional reference, imported by slam_it.eval alone.
[[tool.importlinter.contracts]]
name = "Only eval may import pycolmap"
type = "forbidden"
# An allow-list: all of slam_it is forbidden, the one reference module excepted, so a new
# package is covered without being listed.
source_modules = ["slam_it"]
forbidden_modules = ["pycolmap"]
ignore_imports = ["slam_it.eval.colmap_reference -> pycolmap"]

# The ignored import above hides every chain through colmap_reference, so a pipeline that
# imported it would pass. Pipelines must not depend on the optional reference.
[[tool.importlinter.contracts]]
name = "Pipelines never reach the COLMAP reference"
type = "forbidden"
source_modules = ["slam_it.orchestration"]
forbidden_modules = ["slam_it.eval.colmap_reference"]

[[tool.importlinter.contracts]]
name = "Visual-inertial builds on the edge rung only, not dense or classic"
type = "forbidden"
source_modules = ["slam_it.vi"]
forbidden_modules = ["slam_it.dense", "slam_it.classic"]

[[tool.importlinter.contracts]]
name = "Learned builds on dense only, not edge or classic"
type = "forbidden"
source_modules = ["slam_it.learned"]
forbidden_modules = ["slam_it.edge", "slam_it.classic"]

# import-linter sees external packages as leaves, so a library that imports torch internally
# is banned by name. torch itself only ever goes in an optional extra, never `dependencies`.
[[tool.importlinter.contracts]]
name = "CPU rungs never import PyTorch or a GPU stack (edge compute budgets)"
type = "forbidden"
source_modules = [
  "slam_it.foundations", "slam_it.edge", "slam_it.vi", "slam_it.backends",
]
forbidden_modules = [
  "torch", "torchvision", "cupy", "jax",
  "lietorch", "pypose", "kornia", "theseus",
]

[[tool.importlinter.contracts]]
name = "Depth models are inputs through a provider interface, never imported by algorithms"
type = "forbidden"
source_modules = [
  "slam_it.foundations", "slam_it.edge", "slam_it.vi", "slam_it.classic",
  "slam_it.dense", "slam_it.learned",
]
forbidden_modules = ["unidepth", "moge", "vggt"]

[[tool.importlinter.contracts]]
name = "slam_it never imports reifyscene (the dependency runs one way)"
type = "forbidden"
source_modules = ["slam_it"]
forbidden_modules = ["reifyscene"]

# The upload server (server/, docs/design/2026-10-09-run-viewer.md, section 5.3) holds the
# bucket's keys and the worker token, so it never parses a video: it never imports slam_it,
# whose worker does that work in a process of its own, nor a decoder or an image library
# directly, nor reifyscene (whose GPU worker may one day speak its protocol, from outside).
[[tool.importlinter.contracts]]
name = "The upload server never imports slam_it, a decoder, or reifyscene"
type = "forbidden"
source_modules = ["slam_it_server"]
forbidden_modules = ["slam_it", "av", "PIL", "cv2", "reifyscene"]

# The other way, the library never carries the server or its web stack: the worker talks to the
# server over HTTP with the standard library.
[[tool.importlinter.contracts]]
name = "slam_it never imports the upload server or its web stack"
type = "forbidden"
source_modules = ["slam_it"]
forbidden_modules = ["slam_it_server", "fastapi", "starlette", "uvicorn", "boto3", "botocore"]

# The pipeline and its bake never need the optional `video` extra: eval.video alone imports
# PyAV, and the Pillow-style allow-list above cannot see a chain through it. Of orchestration,
# only the worker, which imports an upload, may import it: any module added beside it may not.
[[tool.importlinter.contracts]]
name = "Of orchestration, only the worker imports the video import"
type = "forbidden"
source_modules = ["slam_it.orchestration"]
forbidden_modules = ["slam_it.eval.video"]
ignore_imports = ["slam_it.orchestration.worker -> slam_it.eval.video"]

# The order of modules inside the upload server: its entry point, the routes, the job list and
# storage beside each other, and the settings at the bottom.
[[tool.importlinter.contracts]]
name = "The upload server's internal order"
type = "layers"
exhaustive = true
containers = ["slam_it_server"]
layers = [
  "__main__",
  "app",
  "jobs | storage",
  "config",
]
