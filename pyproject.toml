[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "slamlab"
# Canonical version lives in the VERSION file; scikit-build-core reads it at build time.
dynamic = ["version"]
description = "A learning ladder for visual SLAM, in Python, C++ and Rust (working name)."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "evan-wes" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# COLMAP's Ceres bundle adjuster, for slamlab.eval.colmap_reference (the only importer).
# The development setup installs it too (scripts/setup_slamlab.sh): it is the reference the
# BA tests and demos compare against.
colmap = ["pycolmap>=4.2"]
# The development and layer-1 toolchain's pip layer: the single list scripts/setup_slamlab.sh
# installs from when not using the lockfile (the conda layer -- compilers, clang tools,
# doxygen, Node.js/jscpd -- is in that script).
dev = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
  "maturin>=1.7",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "import-linter>=2.0",
  # Test-only oracles: SciPy (rotations, least squares) and mpmath (high-precision values
  # for the parity fixtures). manifpy comes from conda-forge (setup_slamlab.sh).
  "scipy>=1.13",
  "mpmath>=1.3",
  # Visualisation for the demos (never imported by the library).
  "rerun-sdk>=0.38",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/slamlab"]
# Editable installs rebuild the C++ extension on import when its sources change
# (needs `pip install --no-build-isolation -e .`).
editable.rebuild = true
# scripts/setup_slamlab.sh sets a per-env build dir (build/<env name>); this is the default
# for other builds (CI, plain pip installs).
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\d+\.\d+\.\d+\.\d+)'

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# Docstring Examples are run as tests so they cannot go stale.
addopts = "--doctest-modules --strict-markers"
# Resource markers. scripts/check.sh runs the default CPU subset (`-m "not gpu and not budget"`);
# GPU and budget-capped runs get their own opt-in scripts when those rungs arrive.
markers = [
  "gpu: needs a CUDA GPU (learned and dense rungs)",
  "budget: runs under a simulated compute budget (edge rungs, milestone 7)",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# D: docstrings (numpy convention) on every module, class and function.
# ANN: type hints on every signature. The rest: correctness, idiom, naming, imports.
select = ["E", "W", "F", "I", "N", "D", "ANN", "B", "UP", "SIM", "RUF", "PL", "PT", "NPY"]
ignore = [
  "PLR2004",  # magic values in comparisons: too noisy for numerical code with tolerances
]
# Greek letters in docstrings are the maths notation (ρ for translation, σ for scale, ...),
# not look-alikes of Latin letters.
allowed-confusables = ["ρ", "σ", "α", "ν"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# pytest fixtures and parametrised arguments are documented by the test's docstring.
"tests/**" = ["ANN001", "ANN201", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/slamlab", "tests", "scripts"]
# The compiled extensions are never imported by name: slamlab.backends locates them
# dynamically, and each algorithm types its backend through a Protocol (e.g.
# slamlab.foundations.so3.Implementation) that tests check the extensions against.

[[tool.mypy.overrides]]
# Test-only oracles that ship without type information.
module = ["mpmath", "manifpy", "scipy.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["slamlab"]
include_external_packages = true

# The ladder as dependency layers, top to bottom. Siblings joined by `|` are independent:
# neither may import the other. Every module inside a package is covered automatically, and
# the contract is exhaustive: a new top-level package fails until it is given a layer.
# scripts/check_layers.py reads this same list to check the C++ includes and Rust crates.
[[tool.importlinter.contracts]]
name = "The ladder's layers (and independent sibling branches)"
type = "layers"
containers = ["slamlab"]
exhaustive = true
layers = [
  "orchestration",
  "eval",
  "learned | vi",
  "dense | edge | classic",
  "foundations",
  "backends",
]

# The order of modules inside rung 0. Parenthesised layers are optional: they are the modules
# milestone 1 adds, so the contract covers each as it lands.
[[tool.importlinter.contracts]]
name = "Rung 0's internal order"
type = "layers"
containers = ["slamlab.foundations"]
layers = [
  "(ba)",
  "(camera) | (nls)",
  "(alignment)",
  "(se3)",
  "so3",
  "arrays",
  "(rng) | (solve)",
  "errors",
]

# The order of modules inside the bundle-adjustment package.
[[tool.importlinter.contracts]]
name = "Bundle adjustment's internal order"
type = "layers"
containers = ["slamlab.foundations.ba"]
layers = [
  "solve",
  "bundle",
  "layout | schur",
  "gauge",
  "problem",
]

# pycolmap is an optional reference, imported by slamlab.eval alone.
[[tool.importlinter.contracts]]
name = "Only eval may import pycolmap"
type = "forbidden"
# An allow-list: all of slamlab is forbidden, the one reference module excepted, so a new
# package is covered without being listed.
source_modules = ["slamlab"]
forbidden_modules = ["pycolmap"]
ignore_imports = ["slamlab.eval.colmap_reference -> pycolmap"]

# The ignored import above hides every chain through colmap_reference, so a pipeline that
# imported it would pass. Pipelines must not depend on the optional reference.
[[tool.importlinter.contracts]]
name = "Pipelines never reach the COLMAP reference"
type = "forbidden"
source_modules = ["slamlab.orchestration"]
forbidden_modules = ["slamlab.eval.colmap_reference"]

[[tool.importlinter.contracts]]
name = "Visual-inertial builds on the edge rung only, not dense or classic"
type = "forbidden"
source_modules = ["slamlab.vi"]
forbidden_modules = ["slamlab.dense", "slamlab.classic"]

[[tool.importlinter.contracts]]
name = "Learned builds on dense only, not edge or classic"
type = "forbidden"
source_modules = ["slamlab.learned"]
forbidden_modules = ["slamlab.edge", "slamlab.classic"]

# import-linter sees external packages as leaves, so a library that imports torch internally
# is banned by name. torch itself only ever goes in an optional extra, never `dependencies`.
[[tool.importlinter.contracts]]
name = "CPU rungs never import PyTorch or a GPU stack (edge compute budgets)"
type = "forbidden"
source_modules = ["slamlab.foundations", "slamlab.edge", "slamlab.vi", "slamlab.backends"]
forbidden_modules = [
  "torch", "torchvision", "cupy", "jax",
  "lietorch", "pypose", "kornia", "theseus",
]

[[tool.importlinter.contracts]]
name = "Depth models are inputs through a provider interface, never imported by algorithms"
type = "forbidden"
source_modules = [
  "slamlab.foundations", "slamlab.edge", "slamlab.vi", "slamlab.classic",
  "slamlab.dense", "slamlab.learned",
]
forbidden_modules = ["unidepth", "moge", "vggt"]

[[tool.importlinter.contracts]]
name = "slamlab never imports reifyscene (the dependency runs one way)"
type = "forbidden"
source_modules = ["slamlab"]
forbidden_modules = ["reifyscene"]
