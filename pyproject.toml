[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "slam-it-all"
# Canonical version lives in the VERSION file; scikit-build-core reads it at build time.
dynamic = ["version"]
description = "A learning ladder for visual SLAM, in Python, C++ and Rust (working name)."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "evan-wes" }]
# Pillow reads image files, in slam_it_all.eval.images alone (a contract below keeps it there).
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
# COLMAP's Ceres bundle adjuster, for slam_it_all.eval.colmap_reference (the only importer).
# The development setup installs it too (scripts/setup_slam_it_all.sh): it is the reference the
# BA tests and demos compare against.
colmap = ["pycolmap>=4.2"]
# The development and layer-1 toolchain's pip layer: the single list scripts/setup_slam_it_all.sh
# installs from when not using the lockfile (the conda layer -- compilers, clang tools,
# doxygen, Node.js/jscpd -- is in that script).
dev = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
  "maturin>=1.7",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "import-linter>=2.0",
  # Test-only oracles: SciPy (rotations, least squares) and mpmath (high-precision values
  # for the parity fixtures). manifpy comes from conda-forge (setup_slam_it_all.sh).
  "scipy>=1.13",
  "mpmath>=1.3",
  # Test-only oracle for the 5-point solvers and the Sampson refinement (a contract forbids
  # the library from importing any test oracle).
  "poselib>=2.0.5",
  # Visualisation for the demos (never imported by the library).
  "rerun-sdk>=0.38",
  # Test-only oracle for the front end's image operations, and the reference the demos
  # compare against (never imported by the library; a contract forbids cv2 in slam_it_all).
  "opencv-python-headless>=5.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/slam_it_all"]
# Editable installs rebuild the C++ extension on import when its sources change
# (needs `pip install --no-build-isolation -e .`).
editable.rebuild = true
# scripts/setup_slam_it_all.sh sets a per-env build dir (build/<env name>); this is the default
# for other builds (CI, plain pip installs).
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\d+\.\d+\.\d+\.\d+)'

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# Docstring Examples are run as tests so they cannot go stale.
addopts = "--doctest-modules --strict-markers"
# Resource markers. scripts/check.sh runs the default CPU subset (`-m "not gpu and not budget"`);
# the budget runs are opt-in (`python -m pytest -m budget`, since PR 9); GPU runs get their own
# opt-in script with the first PyTorch rung.
markers = [
  "gpu: needs a CUDA GPU (learned and dense rungs)",
  "budget: runs under a simulated compute budget (slam_it_all.eval.budgets)",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# D: docstrings (numpy convention) on every module, class and function.
# ANN: type hints on every signature. The rest: correctness, idiom, naming, imports.
select = ["E", "W", "F", "I", "N", "D", "ANN", "B", "UP", "SIM", "RUF", "PL", "PT", "NPY"]
ignore = [
  "PLR2004",  # magic values in comparisons: too noisy for numerical code with tolerances
]
# Greek letters in docstrings are the maths notation (ρ for translation, σ for scale, ...),
# not look-alikes of Latin letters.
allowed-confusables = ["ρ", "σ", "α", "ν", "×"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# pytest fixtures and parametrised arguments are documented by the test's docstring.
"tests/**" = ["ANN001", "ANN201", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/slam_it_all", "tests", "scripts"]
# The compiled extensions are never imported by name: slam_it_all.backends locates them
# dynamically, and each algorithm types its backend through a Protocol (e.g.
# slam_it_all.foundations.so3.Implementation) that tests check the extensions against.

[[tool.mypy.overrides]]
# Test-only oracles that ship without type information.
module = ["mpmath", "manifpy", "scipy.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["slam_it_all"]
include_external_packages = true

# The ladder as dependency layers, top to bottom. Siblings joined by `|` are independent:
# neither may import the other. Every module inside a package is covered automatically, and
# the contract is exhaustive: a new top-level package fails until it is given a layer.
# scripts/check_layers.py reads this same list to check the C++ includes and Rust crates.
[[tool.importlinter.contracts]]
name = "The ladder's layers (and independent sibling branches)"
type = "layers"
containers = ["slam_it_all"]
exhaustive = true
layers = [
  "orchestration",
  "eval",
  "learned | vi",
  "dense | edge | classic",
  "foundations",
  "backends",
]

# The order of modules inside rung 0. Parenthesised layers are optional: they are the modules
# milestone 1 adds, so the contract covers each as it lands, and Rust's `linalg` (the SVD and
# eigendecomposition its modules share), which Python does not need; check_layers.py holds the
# Rust crate to the same order.
[[tool.importlinter.contracts]]
name = "Rung 0's internal order"
type = "layers"
containers = ["slam_it_all.foundations"]
layers = [
  "(ba) | (twoview)",
  "(epipolar) | (homography) | (pnp) | (stereo)",
  "(camera) | (fivepoint) | (matching) | (p3p) | (ransac) | (triangulation)",
  "(nls) | (orb)",
  "(correspondences) | (image)",
  "(alignment)",
  "(se3)",
  "so3",
  "arrays | (linalg)",
  "(rng) | (solve)",
  "errors",
]

# The order of modules inside the bundle-adjustment package.
[[tool.importlinter.contracts]]
name = "Bundle adjustment's internal order"
type = "layers"
containers = ["slam_it_all.foundations.ba"]
layers = [
  "solve",
  "bundle",
  "layout | schur",
  "gauge",
  "problem",
]

# The order of modules inside the edge rung: the settings, a frame and the map at the bottom;
# the observation test and bundle adjustment on them; initialisation, tracking and mapping,
# independent of each other, on those; the pipeline on top. New modules are optional layers.
[[tool.importlinter.contracts]]
name = "The edge rung's internal order"
type = "layers"
containers = ["slam_it_all.edge"]
layers = [
  "(pipeline)",
  "(initialization) | (tracking) | (mapping)",
  "(adjust)",
  "(residuals)",
  "map",
  "frames",
  "options",
]

# OpenCV serves the demos as an external reference only: slam_it_all never wraps it (a stated
# non-goal), and the edge rungs need a light dependency set.
[[tool.importlinter.contracts]]
name = "slam_it_all never imports OpenCV"
type = "forbidden"
source_modules = ["slam_it_all"]
forbidden_modules = ["cv2"]

# The library's runtime is numpy alone (the dependencies above), so none of these may enter
# it; and they are the test oracles, which check slam_it_all against independent implementations,
# so the library using one would make that check circular (PoseLib implements the same
# solvers). A rung that needs one of them at run time changes the dependencies first.
[[tool.importlinter.contracts]]
name = "slam_it_all never imports its test oracles"
type = "forbidden"
source_modules = ["slam_it_all"]
forbidden_modules = ["poselib", "mpmath", "manifpy", "scipy"]

# The order of modules inside eval: the timestamp helpers and the image reader at the bottom,
# the dataset readers and metrics on them, runs (and the COLMAP reference) on them, and the
# compute budgets, which judge runs, on top. New modules are optional layers, as in rung 0's
# contract.
[[tool.importlinter.contracts]]
name = "Eval's internal order"
type = "layers"
containers = ["slam_it_all.eval"]
layers = [
  "(budgets)",
  "(runs) | (colmap_reference)",
  "(metrics) | (tum) | (euroc) | (readers) | (reprojection)",
  "(timestamps) | (images)",
]

# Pillow reads image files in slam_it_all.eval.images alone: the cores decode PNGs natively, and
# the algorithms take arrays, never files.
[[tool.importlinter.contracts]]
name = "Only eval.images may import Pillow"
type = "forbidden"
# An allow-list, as for pycolmap below: all of slam_it_all is forbidden, the one reader excepted.
source_modules = ["slam_it_all"]
forbidden_modules = ["PIL"]
ignore_imports = ["slam_it_all.eval.images -> PIL"]

# pycolmap is an optional reference, imported by slam_it_all.eval alone.
[[tool.importlinter.contracts]]
name = "Only eval may import pycolmap"
type = "forbidden"
# An allow-list: all of slam_it_all is forbidden, the one reference module excepted, so a new
# package is covered without being listed.
source_modules = ["slam_it_all"]
forbidden_modules = ["pycolmap"]
ignore_imports = ["slam_it_all.eval.colmap_reference -> pycolmap"]

# The ignored import above hides every chain through colmap_reference, so a pipeline that
# imported it would pass. Pipelines must not depend on the optional reference.
[[tool.importlinter.contracts]]
name = "Pipelines never reach the COLMAP reference"
type = "forbidden"
source_modules = ["slam_it_all.orchestration"]
forbidden_modules = ["slam_it_all.eval.colmap_reference"]

[[tool.importlinter.contracts]]
name = "Visual-inertial builds on the edge rung only, not dense or classic"
type = "forbidden"
source_modules = ["slam_it_all.vi"]
forbidden_modules = ["slam_it_all.dense", "slam_it_all.classic"]

[[tool.importlinter.contracts]]
name = "Learned builds on dense only, not edge or classic"
type = "forbidden"
source_modules = ["slam_it_all.learned"]
forbidden_modules = ["slam_it_all.edge", "slam_it_all.classic"]

# import-linter sees external packages as leaves, so a library that imports torch internally
# is banned by name. torch itself only ever goes in an optional extra, never `dependencies`.
[[tool.importlinter.contracts]]
name = "CPU rungs never import PyTorch or a GPU stack (edge compute budgets)"
type = "forbidden"
source_modules = [
  "slam_it_all.foundations", "slam_it_all.edge", "slam_it_all.vi", "slam_it_all.backends",
]
forbidden_modules = [
  "torch", "torchvision", "cupy", "jax",
  "lietorch", "pypose", "kornia", "theseus",
]

[[tool.importlinter.contracts]]
name = "Depth models are inputs through a provider interface, never imported by algorithms"
type = "forbidden"
source_modules = [
  "slam_it_all.foundations", "slam_it_all.edge", "slam_it_all.vi", "slam_it_all.classic",
  "slam_it_all.dense", "slam_it_all.learned",
]
forbidden_modules = ["unidepth", "moge", "vggt"]

[[tool.importlinter.contracts]]
name = "slam_it_all never imports reifyscene (the dependency runs one way)"
type = "forbidden"
source_modules = ["slam_it_all"]
forbidden_modules = ["reifyscene"]
