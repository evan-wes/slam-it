[package]
name = "slam-it-all-py"
version = "0.1.0"
description = "Python bindings for SLAM It All!'s Rust core (the slam_it_all_rs module)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "slam_it_all_rs"
crate-type = ["cdylib"]

[dependencies]
nalgebra.workspace = true
numpy = "0.29.0"
pyo3 = "0.29.3"
pythonize = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
slam-it-all-edge = { path = "../slam-it-all-edge" }
slam-it-all-foundations = { path = "../slam-it-all-foundations" }

[lints]
workspace = true
