[package]
name = "slam-it-orchestration"
version = "0.1.0"
description = "SLAM It!'s native programs in Rust: a whole sequence through a rung's pipeline."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nalgebra.workspace = true
slam-it-edge = { path = "../slam-it-edge" }
slam-it-eval = { path = "../slam-it-eval" }
slam-it-foundations = { path = "../slam-it-foundations" }

# The program slam_it.orchestration.vo runs for the rust backend, found by slam_it.backends
# in rust/target/release/ (built by scripts/setup_slam_it.sh and scripts/check.sh).
[[bin]]
name = "slam_it_vo"
path = "src/main.rs"

[lints]
workspace = true
