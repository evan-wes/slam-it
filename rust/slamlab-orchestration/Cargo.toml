[package]
name = "slamlab-orchestration"
version = "0.1.0"
description = "slamlab's native programs in Rust: a whole sequence through a rung's pipeline."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nalgebra.workspace = true
slamlab-edge = { path = "../slamlab-edge" }
slamlab-eval = { path = "../slamlab-eval" }
slamlab-foundations = { path = "../slamlab-foundations" }

# The program slamlab.orchestration.vo runs for the rust backend, found by slamlab.backends in
# rust/target/release/ (built by scripts/setup_slamlab.sh and scripts/check.sh).
[[bin]]
name = "slamlab_vo"
path = "src/main.rs"

[lints]
workspace = true
