[package]
name = "slamlab-py"
version = "0.1.0"
description = "Python bindings for slamlab's Rust core (the slamlab_rs module)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "slamlab_rs"
crate-type = ["cdylib"]

[dependencies]
nalgebra.workspace = true
numpy = "0.29.0"
pyo3 = "0.29.3"
pythonize = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
slamlab-edge = { path = "../slamlab-edge" }
slamlab-foundations = { path = "../slamlab-foundations" }

[lints]
workspace = true
