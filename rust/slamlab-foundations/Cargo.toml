[package]
name = "slamlab-foundations"
version = "0.1.0"
description = "Rung 0 of slamlab's Rust core, foundations -- builds standalone, without Python."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
faer.workspace = true
nalgebra.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
# Exact float parsing: the image and ORB fixtures compare coordinates bit for bit.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[[bench]]
name = "foundations"
harness = false

# The example's BAL reader is tested against the shared fixture by `cargo test`.
[[example]]
name = "bal"
test = true
