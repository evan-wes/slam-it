name: Test
on:
  push:
    branches: [develop, main]
  pull_request:

# One job, the same checks as local: build the conda env with scripts/setup_slamlab.sh, then
# run every layer-1 check with scripts/check.sh. Running the setup script here also proves the
# env, its lockfile and the three-language build reproduce from scratch.
jobs:
  layer1:
    name: Layer-1 checks (Python, C++, Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Miniforge
        run: |
          curl -fsSL -o miniforge.sh \
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash miniforge.sh -b -p "$HOME/miniforge"
          echo "CONDA_EXE=$HOME/miniforge/bin/conda" >> "$GITHUB_ENV"
      - name: Build the slamlab env (scripts/setup_slamlab.sh)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          CARGO_BUILD_JOBS: "4"
        run: scripts/setup_slamlab.sh
      - name: Layer-1 checks (scripts/check.sh)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          CARGO_BUILD_JOBS: "4"
        run: scripts/check.sh --env slamlab
