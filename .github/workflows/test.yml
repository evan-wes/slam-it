name: Test
on:
  push:
    branches: [develop, main]
  pull_request:

# CI builds with the runner's own toolchains (system gcc, preinstalled Rust) rather than
# the conda env scripts/setup_slamlab.sh builds locally: it checks the code builds and
# agrees across languages, not that the local env reproduces.
jobs:
  python:
    name: Python + both extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build slamlab (C++ extension) and slamlab_rs (Rust extension)
        run: |
          python -m pip install -r scripts/locks/slamlab.lock
          python -m pip install --no-build-isolation .
          python -m pip install ./rust/slamlab-py
      - name: All three backends must be present
        run: |
          python -c "import slamlab; b = slamlab.backends.available(); print(b); assert b == ['python', 'cpp', 'rust'], b"
      - run: python -m pytest -q
      - run: ruff check src tests

  cpp:
    name: C++ core (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build/native -DSLAMLAB_BUILD_TESTS=ON
      - run: cmake --build build/native -j4
      - run: ctest --test-dir build/native --output-on-failure

  rust:
    name: Rust core (standalone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test -p slamlab-core
